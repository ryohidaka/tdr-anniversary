# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary and `esbuild` downloads/
# builds native bindings. Without these, pnpm 11+ aborts the install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri@0.4.10"
  - "@astrojs/vite-plugin-astro@0.1.3"
  - astro@7.4.12
  - "@astrojs/cloudflare@14.4.8"
  - miniflare@5.20261113.0-beta
  - wrangler@4.162.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
